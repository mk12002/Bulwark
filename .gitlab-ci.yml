# GitLab CI template for Airlock. Gates the pipeline on findings and exposes the
# JSON report as an artifact. Point the scan at your own model/tool-spec targets.

stages: [security]

airlock-scan:
  stage: security
  image: python:3.11-slim
  script:
    - pip install -e "./packages/airlock[model,mcp]"
    - airlock scan model packages/airlock/fixtures/model/poisoned --format json --fail-on high | tee airlock.json
  artifacts:
    when: always
    paths: [airlock.json]
    expire_in: 30 days
  allow_failure: false

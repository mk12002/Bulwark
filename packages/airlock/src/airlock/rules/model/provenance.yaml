version: 1
target: model
rules:
  - id: M7-hash-mismatch
    category: M7
    title: "File does not match its published SHA256 checksum"
    severity: high
    confidence: high
    match:
      signal: provenance.hash_mismatch
      predicate: non_empty
    rationale: >-
      A weight file whose contents do not match the checksum published alongside it
      has been altered in transit or at rest — a direct tampering/supply-chain signal.
    remediation: >-
      Do not load. Re-download from the authoritative source and re-verify the checksum.
    references: ["OWASP:LLM03:2025", "CWE-494", "CWE-354"]

  - id: M7-no-model-card
    category: M7
    title: "Artifact has no model card"
    severity: low
    confidence: high
    match:
      signal: provenance.missing_model_card
      predicate: is_true
    rationale: >-
      A missing or empty model card removes the primary trust signal about a model's
      origin, training data, and intended use.
    remediation: >-
      Prefer models that ship a populated README/model card describing provenance.
    references: ["OWASP:LLM03:2025", "SLSA"]

  - id: M7-no-hashes
    category: M7
    title: "No published hashes to verify artifact integrity"
    severity: low
    confidence: medium
    match:
      signal: provenance.missing_hashes
      predicate: is_true
    rationale: >-
      Without published checksums there is no way to verify the downloaded weights
      match what the author intended — the precondition for a supply-chain swap.
    remediation: >-
      Obtain and verify checksums (or a signature) for the weight files before loading.
    references: ["OWASP:LLM03:2025", "SLSA"]

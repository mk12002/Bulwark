version: 1
target: model
rules:
  - id: M5-keras-lambda-layer
    category: M5
    title: "Keras model contains a Lambda layer (embedded Python)"
    severity: high
    confidence: medium
    match:
      signal: model.keras_lambda
      predicate: non_empty
    rationale: >-
      Keras Lambda layers store marshalled Python that is compiled and executed when
      the model is loaded — an arbitrary-code-execution vector equivalent to pickle.
    remediation: >-
      Do not load with Lambda layers from an untrusted source. Rebuild the model
      without Lambda layers, or load only after auditing the embedded code.
    references: ["OWASP:LLM05", "CWE-502"]

  - id: M5-onnx-custom-python-op
    category: M5
    title: "ONNX model references a custom Python operator"
    severity: high
    confidence: medium
    match:
      signal: model.onnx_custom_op
      predicate: non_empty
    rationale: >-
      Custom Python operators (PyOp/pyfunc via onnxruntime-extensions) execute
      arbitrary Python during inference.
    remediation: >-
      Do not run ONNX models with custom Python operators from an untrusted source.
    references: ["OWASP:LLM05", "CWE-502"]

  - id: M6-onnx-external-data-traversal
    category: M6
    title: "ONNX model references external data via a traversal path"
    severity: high
    confidence: medium
    match:
      signal: model.onnx_external
      predicate: non_empty
    rationale: >-
      ONNX external-data references are file paths; a '..' traversal path can read or
      point outside the model directory when the runtime loads tensor data.
    remediation: >-
      Reject the model; external-data paths must stay within the model directory.
    references: ["CWE-22"]

  - id: M5-tensorflow-pyfunc-op
    category: M5
    title: "TensorFlow graph contains a PyFunc (arbitrary Python) op"
    severity: high
    confidence: medium
    match:
      signal: model.tf_custom_op
      predicate: non_empty
    rationale: >-
      A TensorFlow SavedModel/GraphDef with a PyFunc/EagerPyFunc op runs arbitrary Python
      embedded in the graph when the model is loaded or executed.
    remediation: >-
      Do not load untrusted graphs with PyFunc ops; rebuild the graph without them.
    references: ["OWASP:LLM05", "CWE-502"]

  - id: M6-tensorflow-io-op
    category: M6
    title: "TensorFlow graph contains a host filesystem op"
    severity: medium
    confidence: low
    match:
      signal: model.tf_io_op
      predicate: non_empty
    rationale: >-
      A ReadFile/WriteFile op inside a TensorFlow graph can touch the host filesystem when
      the graph runs — unexpected for a pure model artifact.
    remediation: >-
      Review why the graph performs filesystem I/O; prefer graphs without host I/O ops.
    references: ["CWE-73"]

  - id: M6-format-extension-mismatch
    category: M6
    title: "File content does not match its extension (format spoofing)"
    severity: high
    confidence: high
    match:
      signal: model.format_mismatch
      predicate: non_empty
    rationale: >-
      A file whose extension implies a safe/non-pickle format but whose bytes are a
      pickle stream is a scanner-evasion technique: an extension-based classifier skips
      the pickle scan, shipping the payload undetected (e.g. the picklescan CVE-2025-10155
      bypass class). Airlock disassembles by content, so the hidden pickle is scanned anyway.
    remediation: >-
      Reject the file. A model weight file must match its declared format; a pickle
      masquerading as safetensors/GGUF/etc. is almost always malicious.
    references: ["OWASP:LLM05", "CWE-646", "CWE-502"]

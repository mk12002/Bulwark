version: 1
target: mcp
rules:
  - id: P6-embedded-secret
    category: P6
    title: "Tool schema or default embeds a credential/token"
    severity: high
    confidence: high
    match:
      signal: secret.finding
      predicate: non_empty
    rationale: >-
      Credentials, API tokens, or connection strings baked into a schema default are
      disclosed to every client and are a direct leakage vector.
    remediation: >-
      Remove secrets from schemas/defaults; source them from the environment at runtime.
    references: ["OWASP:LLM02", "CWE-798"]

  - id: P6-env-echo
    category: P6
    title: "Tool advertises echoing environment variables"
    severity: high
    confidence: medium
    match:
      signal: tool.env_echo
      predicate: is_true
    rationale: >-
      A tool that returns environment variables can leak secrets held in the process
      environment to the agent and onward.
    remediation: >-
      Never expose raw environment; return only explicitly whitelisted, non-secret values.
    references: ["OWASP:LLM02", "CWE-798"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlock"
version = "0.1.0"
description = "Static security scanner for the AI agent supply chain — audit ML models and MCP servers before they touch your agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Airlock contributors" }]
keywords = ["security", "mcp", "machine-learning", "supply-chain", "scanner", "sarif"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "bulwark-core",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
model = [
    "huggingface_hub>=0.23",
]
mcp = [
    "mcp>=1.0",
]
ai = [
    "httpx>=0.27",
]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
    "huggingface_hub>=0.23",
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.scripts]
airlock = "airlock.cli:app"

[project.urls]
Homepage = "https://github.com/airlock/airlock"
Documentation = "https://github.com/airlock/airlock/blob/main/docs/PROJECT_REFERENCE.md"

[tool.hatch.build.targets.wheel]
packages = ["airlock"]

[tool.hatch.build.targets.wheel.force-include]
"airlock/rules" = "airlock/rules"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["airlock", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",    # typer uses function calls in argument defaults
    "RUF001",  # prose/docstrings deliberately use en/em dashes and unicode
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["airlock.scanners.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "huggingface_hub.*",
    "mcp.*",
    "yaml.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that spawn a live MCP fixture server over stdio",
]

[tool.coverage.run]
source = ["airlock"]
branch = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulwark-core"
version = "0.1.0"
description = "Shared spine for the Bulwark security stack: findings model, rule engine, reporters, AI layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bulwark contributors" }]
keywords = ["security", "findings", "rule-engine", "sarif", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.urls]
Homepage = "https://github.com/mk12002/Bulwark"
Repository = "https://github.com/mk12002/Bulwark"
Changelog = "https://github.com/mk12002/Bulwark/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["bulwark_core"]

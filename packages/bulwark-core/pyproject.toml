[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulwark-core"
version = "0.2.0"
description = "Shared spine for the Bulwark security stack: findings model, rule engine, reporters, AI layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bulwark contributors" }]
keywords = ["security", "findings", "rule-engine", "sarif", "supply-chain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
]

[project.optional-dependencies]
ai = ["httpx>=0.27"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/mk12002/Bulwark"
Repository = "https://github.com/mk12002/Bulwark"
Changelog = "https://github.com/mk12002/Bulwark/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/bulwark_core"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["yaml.*", "httpx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/bulwark_core"]
branch = true

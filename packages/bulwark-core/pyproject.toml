[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulwark-core"
version = "0.1.0"
description = "Shared spine for the Bulwark security stack: findings model, rule engine, reporters, AI layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bulwark contributors" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "rich>=13.7",
    "jinja2>=3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["bulwark_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bulwark"
version = "0.1.0"
description = "The security stack for agentic AI — one CLI over Airlock, Warden, and Manifest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bulwark contributors" }]
keywords = ["ai-security", "supply-chain", "mcp", "agents", "ai-bom"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "bulwark-core",
    "airlock",
    "warden",
    "manifest",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
]

[project.scripts]
bulwark = "bulwark.cli:app"

[project.urls]
Homepage = "https://github.com/mk12002/Bulwark"
Repository = "https://github.com/mk12002/Bulwark"
Documentation = "https://github.com/mk12002/Bulwark/blob/main/docs/USAGE.md"
Issues = "https://github.com/mk12002/Bulwark/issues"
Changelog = "https://github.com/mk12002/Bulwark/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["bulwark"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["bulwark", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["airlock.*", "warden.*", "manifest.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

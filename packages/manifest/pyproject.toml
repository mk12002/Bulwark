[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "manifest"
version = "0.1.0"
description = "AI-BOM generator for AI systems — inventory + governance (part of the Bulwark suite)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bulwark contributors" }]
keywords = ["ai-bom", "sbom", "cyclonedx", "governance", "nist-ai-rmf", "supply-chain"]
dependencies = [
    "bulwark-core",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Risk bridges call the sibling tools as libraries.
risk = ["airlock", "warden"]
osv = ["httpx>=0.27"]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "types-PyYAML>=6.0",
    "airlock",
    "warden",
    "httpx>=0.27",
]

[project.scripts]
manifest = "manifest.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["manifest"]

[tool.hatch.build.targets.wheel.force-include]
"manifest/rules" = "manifest/rules"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["manifest", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml.*", "httpx.*", "airlock.*", "warden.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that hit the OSV API"]

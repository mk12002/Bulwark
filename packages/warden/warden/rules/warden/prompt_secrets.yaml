version: 1
target: agent
rules:
  - id: A4-weak-system-prompt
    category: A4
    title: "Over-broad system-prompt authority / weak guardrails"
    severity: medium
    confidence: low
    match:
      signal: agent.weak_prompt
      predicate: non_empty
    rationale: >-
      The system prompt grants open-ended autonomy or provides no guardrails for an
      agent that holds high-impact tools.
    remediation: >-
      Add explicit scope limits and refusal conditions to the system prompt; avoid
      open-ended authority phrasing.
    references: ["OWASP:LLM01:2025", "OWASP:LLM06:2025"]

  - id: A6-embedded-secret
    category: A6
    title: "Credential/secret embedded in the assembly"
    severity: high
    confidence: high
    match:
      signal: agent.embedded_secret
      predicate: non_empty
    rationale: >-
      An API key/token embedded in the config or broadly injected is disclosed to the
      whole assembly and is a direct leakage vector.
    remediation: >-
      Remove secrets from the config; inject them from the environment at runtime, scoped
      to the single tool that needs them.
    references: ["CWE-798", "OWASP:LLM02:2025"]

  - id: A9-unscanned-parts
    category: A9
    title: "Wired MCP servers not verified by Airlock"
    severity: medium
    confidence: medium
    match:
      signal: agent.unscanned_parts
      predicate: non_empty
    rationale: >-
      The assembly wires MCP servers whose tools have not been scanned for poisoning or
      over-permission — untrusted parts inside the trust boundary.
    remediation: >-
      Scan each server with Airlock (or `warden audit --scan-parts`) before wiring it in.
    references: ["OWASP:LLM03:2025"]

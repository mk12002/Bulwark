[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "warden"
version = "0.2.0"
description = "Least-privilege auditor for AI agents — scan the assembly (part of the Bulwark suite)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Bulwark contributors" }]
keywords = ["security", "ai-agents", "least-privilege", "excessive-agency", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "bulwark-core",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The --scan-parts bridge runs Airlock on the MCP servers an assembly wires in.
bridge = ["airlock"]
dev = [
    "ruff>=0.16.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "types-PyYAML>=6.0.12.20260724",
    "airlock",
]

[project.scripts]
warden = "warden.cli:app"

[project.urls]
Homepage = "https://github.com/mk12002/Bulwark"
Repository = "https://github.com/mk12002/Bulwark"
Documentation = "https://github.com/mk12002/Bulwark/blob/main/docs/PROJECT_REFERENCE_WARDEN.md"
Issues = "https://github.com/mk12002/Bulwark/issues"
Changelog = "https://github.com/mk12002/Bulwark/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/warden"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["fixtures"]  # fixtures are intentionally partial/inert sample configs

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["yaml.*", "airlock.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: Release

# Builds each package's wheel/sdist and publishes to PyPI on a version tag.
# This is a monorepo, so every package under packages/ is built and published
# independently. Publishing uses PyPI Trusted Publishing (OIDC) — no stored token.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      # Fail-fast off so one package's hiccup doesn't block the others; publish
      # bulwark-core first in practice (order here is documentary, jobs run in parallel).
      fail-fast: false
      matrix:
        package: [bulwark-core, airlock, warden, manifest, bulwark]
    environment: pypi
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build ${{ matrix.package }}
        run: |
          python -m pip install --upgrade build twine
          python -m build packages/${{ matrix.package }} --outdir dist
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.package }}
          path: dist/

      - name: Publish ${{ matrix.package }} to PyPI
        if: startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [bulwark-core, airlock, warden, manifest, bulwark]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install siblings first (path deps), then this package with dev extras.
      # No `|| fallback` on the extras: a silently degraded install turns real
      # failures into skipped tests, which is the worst outcome in a security gate.
      - name: Install workspace
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/bulwark-core[dev]"
          pip install -e "packages/airlock[dev,model,mcp,ai]"
          pip install -e "packages/warden[dev]"
          pip install -e "packages/manifest[dev,osv]"
          pip install -e "packages/bulwark[dev]"

      # Pinned: an unpinned lint/type/test toolchain means a third-party release can
      # break the build with no change on our side — exactly the reproducibility gap
      # Manifest's own B1 finding reports on other people's projects.
      - name: Install the pinned toolchain
        run: pip install "ruff==0.15.20" "mypy==2.1.0" "pytest==9.1.1" "pytest-cov==7.1.0"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy ${{ matrix.package == 'bulwark-core' && 'bulwark_core' || matrix.package }}

      - name: Pytest (with coverage)
        run: |
          if [ -d tests ]; then
            pkg="${{ matrix.package == 'bulwark-core' && 'bulwark_core' || matrix.package }}"
            pytest -q --cov="$pkg" --cov-report=term-missing --cov-report=xml
          else
            echo "no tests (exercised via tools)"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage.xml
          if-no-files-found: ignore

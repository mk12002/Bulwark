name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [bulwark-core, airlock, warden, manifest, bulwark]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install siblings first (path deps), then this package with dev extras.
      - name: Install workspace
        working-directory: .
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/bulwark-core
          pip install -e "packages/airlock[dev,model,mcp]" || pip install -e packages/airlock
          pip install -e "packages/warden[dev]" || pip install -e packages/warden
          pip install -e "packages/manifest[dev]" || pip install -e packages/manifest
          pip install -e packages/bulwark
          pip install ruff mypy pytest pytest-cov

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy ${{ matrix.package == 'bulwark-core' && 'bulwark_core' || matrix.package }}

      - name: Pytest (with coverage)
        run: |
          if [ -d tests ]; then
            pkg="${{ matrix.package == 'bulwark-core' && 'bulwark_core' || matrix.package }}"
            pytest -q --cov="$pkg" --cov-report=term-missing --cov-report=xml
          else
            echo "no tests (exercised via tools)"
          fi

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.package }}
          path: packages/${{ matrix.package }}/coverage.xml
          if-no-files-found: ignore

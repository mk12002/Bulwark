name: Docs

# Builds the MkDocs Material site and publishes it to GitHub Pages.
#
# The build runs on pull requests too — with --strict, so a broken nav entry or a
# missing page fails review rather than shipping a broken site. Only pushes to main
# deploy.
#
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # Pinned so a theme release cannot break the docs build with no commit on our
        # side — the same reproducibility argument Manifest's B1 makes about unpinned
        # dependencies. Bump deliberately, via Dependabot.
        run: pip install "mkdocs-material==9.7.7"

      - name: Build (strict)
        run: mkdocs build --strict

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
